
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HyNova APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          if [ -f gradlew ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f app/gradlew ]; then
            echo "dir=app" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: gradlew not found in repository root or app/"
            find . -maxdepth 3 \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \)
            exit 1
          fi

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HyNova-Android-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
